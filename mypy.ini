# Strict type checking of the repository's own Python tooling.
#
# Scope: tools/ (the static checks and their runner, the issue audit, the
# Accuracy Gate's change selector) and .github/scripts/ (the release bundle
# builder). The benchmark and evidence scripts under benchmark/ are not in
# scope: they depend on mpmath and SymPy, which ship no type information.
#
# python_version is the documented minimum Python (tools/README.md, "Python
# versions"), so the checks reject an API newer than that floor.
#
# Run: python -m mypy   (the static-check runner runs the same command)
[mypy]
files = tools, .github/scripts
python_version = 3.11
strict = True
warn_unused_configs = True
show_error_codes = True
pretty = True
