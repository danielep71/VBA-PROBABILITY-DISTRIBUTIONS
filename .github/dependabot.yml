# Keep the GitHub Actions used by the workflows current.
#
# Every `uses:` is pinned to a full commit SHA with its release as a trailing
# comment. Dependabot proposes each update as a reviewed pull request that moves
# the SHA and the comment together, so a pin can neither drift silently (a moved
# tag) nor go stale unnoticed (a deprecated runtime, as the Node 20 majors did
# before #30). Approval and merge stay manual.
#
# The labels must exist in .github/labels.json. Label sync prunes anything not
# listed there, so Dependabot's own default labels would be deleted again.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "CI"
      - "testing"
    groups:
      # github/codeql-action publishes init, analyze and upload-sarif as
      # separate action paths within one release, and Dependabot would propose
      # one pull request per path. The action refuses a mixed release (analyze
      # rejects a configuration written by a different init version), so split
      # proposals could never go green individually. One grouped pull request
      # moves every call site to the same SHA at once.
      codeql-action:
        patterns:
          - "github/codeql-action*"
