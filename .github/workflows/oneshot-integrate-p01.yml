name: One-shot integrate P0.1 onto current main

on:
  push:
    branches: [p0-excel-certification-v2]
    paths:
      - ".github/workflows/oneshot-integrate-p01.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge original P0.1 history, preserving current-main conflict side
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin p0-excel-certification
          git merge --no-commit --no-ff -X ours origin/p0-excel-certification
      - name: Reconcile P0.1 with P0.2/P0.3 and latest provenance hardening
        shell: python
        run: |
          from pathlib import Path
          import json
          import subprocess

          root = Path('.')

          # P0.1 replaces the ad-hoc export-record parser with the canonical
          # exact-SHA validator. No later main commit changed this checker.
          data = subprocess.check_output([
              'git','show','origin/p0-excel-certification:benchmark/check_manifest_provenance.py'
          ])
          (root/'benchmark/check_manifest_provenance.py').write_bytes(data)

          # test_manifest_provenance.py was auto-merged above. Keep that result:
          # it combines P0.1 canonical-record fixtures with current-main's later
          # --from-fresh-export interlock tests. Do not replace it wholesale.

          # Full history is required by per-commit provenance tests.
          wf = root/'.github/workflows/accuracy-gate.yml'
          text = wf.read_text(encoding='utf-8')
          needle = '      - name: Check out repository\n        uses: actions/checkout@v7\n'
          repl = ('      - name: Check out repository\n'
                  '        uses: actions/checkout@v7\n'
                  '        with:\n'
                  '          fetch-depth: 0\n')
          if 'fetch-depth: 0' not in text:
              if needle not in text:
                  raise SystemExit('accuracy-gate checkout anchor not found')
              text = text.replace(needle, repl, 1)
              wf.write_text(text, encoding='utf-8')

          # P0.3 owns the pre-gate shim. Add P0.1's executable negative fixture
          # without replacing the later P0.2/P0.3 commands.
          shim = root/'benchmark/test_evidence_tools.py'
          text = shim.read_text(encoding='utf-8')
          anchor = '    ("student_t_large_df_study/test_coefficients.py",),\n'
          line = '    ("test_excel_certification.py",),\n'
          if line not in text:
              if anchor not in text:
                  raise SystemExit('test_evidence_tools insertion anchor not found')
              text = text.replace(anchor, anchor + line, 1)
              shim.write_text(text, encoding='utf-8')

          # Add exact-SHA Excel certification to the P0.3 machine-readable matrix.
          matrix_path = root/'benchmark/verification_depth.json'
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          ids = [c['id'] for c in matrix['controls']]
          if 'excel-exact-sha-certification' not in ids:
              matrix['controls'].append({
                  'id': 'excel-exact-sha-certification',
                  'live_command': 'check_excel_certification.py --record <record> --require-pass',
                  'proof_command': 'test_excel_certification.py',
                  'negative_claim': 'candidate/source/workflow SHA drift, assertion drift, cleanup failure and false grid export hash/row/target claims are rejected',
                  'current_state': 'mechanism_green_runtime_evidence_pending_self_hosted_excel'
              })
          matrix_path.write_text(json.dumps(matrix, indent=2) + '\n', encoding='utf-8')

          vd = root/'docs/VERIFICATION_DEPTH.md'
          text = vd.read_text(encoding='utf-8')
          note = ('\n## Excel exact-SHA certification\n\n'
                  '`excel-exact-sha-certification` is a release-blocking assurance control. '
                  'Its portable negative proof is `benchmark/test_excel_certification.py`; '
                  'a green portable proof does not substitute for the self-hosted Excel runtime record. '
                  'The live runtime record must bind the full candidate SHA, exact imported-source hashes, '
                  '909 regression assertions, Excel/build/bitness, and cleanup status. Fresh-grid export claims '
                  'remain separate and require explicit matching grid digest and row-count evidence.\n')
          if '## Excel exact-SHA certification' not in text:
              vd.write_text(text.rstrip() + '\n' + note, encoding='utf-8')

          # Preserve current-main provenance procedure and add only the canonical
          # certification relationship.
          prov = root/'benchmark/PROVENANCE.md'
          text = prov.read_text(encoding='utf-8')
          note = ('\n\n## Canonical Excel certification record\n\n'
                  'The manifests bind committed observation bytes to source. Separately, '
                  '`excel-certification.json` / retained `benchmark/excel_regression_record.json` '
                  'bind an Excel runtime session to one full candidate SHA and exact imported VBA bytes. '
                  'A regression-only record has every grid entry `exported: false` and cannot authorize a manifest rebind. '
                  'Only a record finalized from a real fresh export, with the relevant grid marked exported and matching '
                  'SHA-256/row count, may satisfy the byte-identical-grid exception in `check_manifest_provenance.py`. '
                  'See `docs/EXCEL_CERTIFICATION.md`.\n')
          if '## Canonical Excel certification record' not in text:
              prov.write_text(text.rstrip() + note, encoding='utf-8')

          ch = root/'CHANGELOG.md'
          text = ch.read_text(encoding='utf-8')
          added = ('- Added exact-SHA Excel certification records binding the candidate commit, '
                   'imported VBA source hashes, Excel environment, regression totals, cleanup status, and retained log digest.\n')
          validation = ('- Added negative controls for Excel candidate/source/workflow SHA drift, assertion-count drift, '
                        'cleanup failure, and false grid export target/hash/row-count claims.\n')
          if added not in text:
              marker = '### Added\n\n'
              if marker not in text:
                  raise SystemExit('CHANGELOG Added anchor not found')
              text = text.replace(marker, marker + added, 1)
          if validation not in text:
              marker = '### Validation\n\n'
              if marker not in text:
                  raise SystemExit('CHANGELOG Validation anchor not found')
              text = text.replace(marker, marker + validation, 1)
          ch.write_text(text, encoding='utf-8')

          # Temporary integration workflow must not survive the integration commit.
          (root/'.github/workflows/oneshot-integrate-p01.yml').unlink()

      - name: Commit integrated P0.1 branch
        run: |
          git add -A
          git diff --cached --check
          python benchmark/test_excel_certification.py
          python benchmark/test_manifest_provenance.py
          python benchmark/check_verification_depth.py
          git commit -m "merge(p0.1): integrate exact-SHA Excel certification with current main"
          git push origin HEAD:p0-excel-certification-v2
