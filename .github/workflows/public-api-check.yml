name: Public API Check

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmark/check_public_api.py"
      - "benchmark/test_public_api.py"
      - "docs/PUBLIC_API.txt"
      - ".github/workflows/public-api-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run public API negative controls
        working-directory: benchmark
        run: python test_public_api.py
      - name: Verify frozen public API
        working-directory: benchmark
        run: python check_public_api.py
