name: Gamma Pair Candidate Fidelity

on:
  workflow_dispatch:
  push:
    branches: [study/307-fast-arithmetic-diagnosis]
    paths:
      - benchmark/gamma_route_study/**
      - .github/workflows/gamma-pair-study.yml

env:
  PYTHON_VERSION: "3.12.16"

permissions:
  contents: read

concurrency:
  group: gamma-pair-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Generate reversible instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --only-binary=:all: --require-hashes -r benchmark/requirements-ci.txt
      - run: python benchmark/gamma_route_study/test_pair_candidate.py
      - run: python benchmark/gamma_route_study/prepare_pair_host.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gamma-pair-inputs-${{ github.run_id }}
          path: artifacts/gamma-pair/
          if-no-files-found: error
          retention-days: 30
  profile:
    name: Validate pair candidate fidelity and measure warm cost
    needs: prepare
    runs-on: [self-hosted, Windows, X64, excel]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gamma-pair-inputs-${{ github.run_id }}
          path: artifacts/gamma-pair/
      - name: Check revealed inputs and measure paired kernels
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File benchmark\gamma_route_study\Run-PairStudy.ps1 -RepositoryRoot "%GITHUB_WORKSPACE%"
      - name: Upload measurements and exact instrumentation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gamma-pair-study-${{ github.run_id }}
          path: |
            artifacts/gamma-pair/*.json
            artifacts/gamma-pair/*.txt
          retention-days: 30
          if-no-files-found: error
  analyze:
    name: Validate complete pair evidence
    needs: profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gamma-pair-study-${{ github.run_id }}
          path: artifacts/gamma-pair/
      - run: python benchmark/gamma_route_study/validate_pair_host.py artifacts/gamma-pair >> "$GITHUB_STEP_SUMMARY"
