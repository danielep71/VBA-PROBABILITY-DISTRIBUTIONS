name: Excel VBA Regression

on:
  # A dispatch runs the regression, as every other event does. The export
  # inputs below add an unattended grid export after a green regression, in
  # the same job on the same runner (#181). They default to off, so a plain
  # dispatch is a regression-only run. A dispatch uses this file as it exists
  # at the dispatched ref, so a branch can test changes to the export before
  # they reach main.
  workflow_dispatch:
    inputs:
      export_main:
        description: "Also export benchmark/probability_accuracy_grid.csv after a green regression"
        type: boolean
        default: false
      export_holdout:
        description: "Also export benchmark/holdout/holdout_grid.csv after a green regression"
        type: boolean
        default: false
      export_holdout_older:
        description: "Also export benchmark/holdout_older/holdout_older_grid.csv after a green regression"
        type: boolean
        default: false
      export_survival_boundary:
        description: "Also export benchmark/survival_boundary/survival_boundary_grid.csv after a green regression"
        type: boolean
        default: false
      export_tchi_large_df:
        description: "Also export benchmark/tchi_large_df/tchi_large_df_grid.csv after a green regression"
        type: boolean
        default: false
      # One text input names any study grids, so a new study needs an export
      # spec in ci/ExcelGridExport.psm1, not another input here (#225).
      run_studies:
        description: "Also run the study batteries (#300) after a green regression; always on when any grid is exported"
        type: boolean
        default: true
      export_studies:
        description: "Also export these study grids after a green regression, comma-separated: prs_gamma_probe, prs_chisquare_probe, prs_gamma_holdout, prs_chisquare_holdout, prs_gamma_q_complement, gss_small_shape, glq_lower_q, gbr_binary64_map"
        type: string
        default: ""
      main_mode:
        description: "Main grid only: full re-export, or missing-only (fill blank observed_vba cells). The holdout exporters always fill every row."
        type: choice
        options:
          - full
          - missing-only
        default: full
  # The dedicated cache-study branch always refreshes the already revealed
  # main/holdout grids after green regression; the new #307 holdout is excluded.
  push:
    branches:
      - main
      - "release/**"
      - "study/307-loggamma-cache"
    paths:
      - "src/**"
      - "tests/**"
      - "ci/**"
      - ".github/excel-evidence-policy.json"
      - ".github/workflows/excel-vba-regression.yml"
  # Unfiltered PR reporting. Not a required check: a skipped fork-PR job would
  # report success. Excel certification is enforced at release (release.yml
  # validates benchmark/excel_regression_record.json; see #31). Fork PRs
  # deliberately cannot execute on this Windows host.
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: excel-vba-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Run Excel/VBA regression harness

    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on:
      - self-hosted
      - Windows
      - X64
      - excel

    # 20 minutes for the regression alone. A run that also exports gets 120,
    # more than the export adapter's own per-macro watchdog limits add up to.
    timeout-minutes: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.export_main || inputs.export_holdout || inputs.export_holdout_older || inputs.export_survival_boundary || inputs.export_tchi_large_df || inputs.export_studies != '')) || (github.event_name == 'push' && github.ref == 'refs/heads/study/307-loggamma-cache')) && 120 || 20 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete VBA regression suite through Excel COM
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Run-ExcelVbaTests.ps1 -RepositoryRoot "%GITHUB_WORKSPACE%" ${{ ((github.event_name == 'workflow_dispatch' && (inputs.run_studies || inputs.export_main || inputs.export_holdout || inputs.export_holdout_older || inputs.export_survival_boundary || inputs.export_tchi_large_df || inputs.export_studies != '')) || (github.event_name == 'push' && github.ref == 'refs/heads/study/307-loggamma-cache')) && '-RunStudies' || '' }}

      - name: Upload exact-SHA VBA certification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: excel-vba-regression-${{ github.run_id }}
          path: |
            artifacts/excel-vba-ci/test-result.txt
            artifacts/excel-vba-ci/excel-certification.json
          if-no-files-found: warn
          retention-days: 30

      # Runs only after the regression step succeeded, which it does only for
      # a green record; the adapter checks the record again before Excel
      # starts. It never writes to the repository.
      - name: Export selected grids through Excel COM
        id: export
        if: (github.event_name == 'workflow_dispatch' && (inputs.export_main || inputs.export_holdout || inputs.export_holdout_older || inputs.export_survival_boundary || inputs.export_tchi_large_df || inputs.export_studies != '')) || (github.event_name == 'push' && github.ref == 'refs/heads/study/307-loggamma-cache')
        shell: cmd
        env:
          EXPORT_MAIN: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/study/307-loggamma-cache') || inputs.export_main }}
          EXPORT_HOLDOUT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/study/307-loggamma-cache') || inputs.export_holdout }}
          EXPORT_HOLDOUT_OLDER: ${{ inputs.export_holdout_older || false }}
          EXPORT_SURVIVAL_BOUNDARY: ${{ inputs.export_survival_boundary || false }}
          EXPORT_TCHI_LARGE_DF: ${{ inputs.export_tchi_large_df || false }}
          # Read by the adapter from the environment, not expanded by cmd.
          EXPORT_STUDIES: ${{ inputs.export_studies }}
          EXPORT_MAIN_MODE: ${{ inputs.main_mode || 'full' }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Export-ExcelGrids.ps1 -RepositoryRoot "%GITHUB_WORKSPACE%" -Main "%EXPORT_MAIN%" -Holdout "%EXPORT_HOLDOUT%" -HoldoutOlder "%EXPORT_HOLDOUT_OLDER%" -SurvivalBoundary "%EXPORT_SURVIVAL_BOUNDARY%" -TChiLargeDf "%EXPORT_TCHI_LARGE_DF%" -MainMode "%EXPORT_MAIN_MODE%"

      - name: Upload exact-SHA grid export
        if: always() && steps.export.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: excel-grid-export-${{ github.run_id }}
          path: artifacts/excel-grid-export/
          if-no-files-found: error
          retention-days: 30
