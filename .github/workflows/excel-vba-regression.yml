name: Excel VBA Regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "ci/**"
      - ".github/excel-evidence-policy.json"
      - ".github/workflows/excel-vba-regression.yml"
  # Unfiltered PR reporting. Not a required check: a skipped fork-PR job would
  # report success. Excel certification is enforced at release (release.yml
  # validates benchmark/excel_regression_record.json; see #31). Fork PRs
  # deliberately cannot execute on this Windows host.
  pull_request:
    branches:
      - main

concurrency:
  group: excel-vba-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Run Excel/VBA regression harness

    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on:
      - self-hosted
      - Windows
      - X64
      - excel

    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete VBA regression suite through Excel COM
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Run-ExcelVbaTests.ps1 -RepositoryRoot "%GITHUB_WORKSPACE%"

      - name: Upload exact-SHA VBA certification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: excel-vba-regression-${{ github.run_id }}
          path: |
            artifacts/excel-vba-ci/test-result.txt
            artifacts/excel-vba-ci/excel-certification.json
          if-no-files-found: warn
          retention-days: 30
