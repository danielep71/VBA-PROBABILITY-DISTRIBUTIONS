name: CodeQL
run-name: CodeQL — ${{ github.ref_name }} @ ${{ github.sha }}

# Security analysis of the repository's Python tooling, its JavaScript
# workflow scripts (.github/scripts) and its GitHub Actions workflows.
# CodeQL cannot analyze VBA; this neither executes Excel nor certifies a
# release. Adapted from the portfolio template's codeql.yml.
#
# Pushes and the weekly schedule publish results to code scanning. Pull
# requests are analyzed read-only: results are kept as an artifact and the job
# never receives write permission, so untrusted pull-request code cannot
# publish anything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions, javascript-typescript]

    steps:
      - name: Check out the exact SHA under analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  analyze-pr:
    name: Analyze PR ${{ matrix.language }} (read-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions, javascript-typescript]

    steps:
      - name: Check out the pull-request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze without publishing
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}-pr"
          upload: never
          upload-database: false
          output: codeql-pr-results

      - name: Keep the pull-request SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-pr-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: codeql-pr-results
          if-no-files-found: error
          retention-days: 30
