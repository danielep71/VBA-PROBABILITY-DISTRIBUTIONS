name: Verification Depth Check

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmark/**"
      - "docs/VERIFICATION_DEPTH.md"
      - ".github/workflows/verification-depth-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification-depth:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install proof dependencies
        run: python -m pip install --upgrade pip mpmath "sympy==1.14.0"
      - name: Run all pre-gate assurance proofs
        working-directory: benchmark
        run: python test_evidence_tools.py
