name: Excel runner watch

# The Excel regression and every grid export run on one self-hosted Windows
# runner (#295). Two jobs keep it from failing silently:
#
#   retry   after a failed Excel VBA Regression run, re-runs its failed jobs
#           once when the failure is infrastructure (job set-up, checkout, a
#           lost runner). A failure of the regression or export step is never
#           re-run automatically.
#   watch   on a schedule, opens or updates one issue when a run sits queued
#           with no job, or a job waits for the runner beyond its limit, and
#           closes the issue when the condition clears.
#
# tools/excel_runner_watch.py holds the rules; tests/test_excel_runner_watch.py
# tests them. Both triggers run this file from the default branch only.

on:
  workflow_run:
    workflows: ["Excel VBA Regression"]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: excel-runner-watch-${{ github.event_name }}-${{ github.event.workflow_run.id || 'watch' }}
  cancel-in-progress: false

jobs:
  retry:
    name: Retry an infrastructure failure once
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify the failure and re-run it if it is infrastructure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/retry"
          mkdir -p "$work"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > "$work/run.json"
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[]' | jq -s '{jobs: .}' > "$work/jobs.json"
          echo "{}" > "$work/annotations.json"
          for job in $(jq -r '.jobs[] | select(.conclusion == "failure") | .id' "$work/jobs.json"); do
            gh api "repos/$GH_REPO/check-runs/$job/annotations" --jq '[.[].message]' > "$work/notes.json"
            jq --arg id "$job" --slurpfile notes "$work/notes.json" '.[$id] = $notes[0]' \
              "$work/annotations.json" > "$work/next.json"
            mv "$work/next.json" "$work/annotations.json"
          done
          decision="$(python3 tools/excel_runner_watch.py retry --run "$work/run.json" \
            --jobs "$work/jobs.json" --annotations "$work/annotations.json")"
          echo "$decision" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$decision" in
            rerun:*) gh run rerun "$RUN_ID" --failed ;;
          esac

  watch:
    name: Report a stuck queue or an offline runner
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect the queue and keep the alert issue in step with it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/watch"
          mkdir -p "$work/jobs"
          # Every page: a backlog is exactly when a stalled run may sit beyond
          # the first hundred, and a partial list could close a live alert.
          for status in queued in_progress; do
            gh api --paginate "repos/$GH_REPO/actions/runs?status=$status&per_page=100" \
              --jq '.workflow_runs[]' > "$work/$status.jsonl"
          done
          jq -s '{workflow_runs: .}' "$work/queued.jsonl" "$work/in_progress.jsonl" \
            > "$work/runs.json"
          for run in $(jq -r '.workflow_runs[].id' "$work/runs.json"); do
            gh api --paginate "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100" \
              --jq '.jobs[]' | jq -s '{jobs: .}' > "$work/jobs/$run.json"
          done
          # The open milestone with the earliest due date after today (UTC).
          milestone="$(TODAY="$(date -u +%F)" gh api \
            "repos/$GH_REPO/milestones?state=open&sort=due_on&direction=asc" \
            --jq 'first(.[] | select(.due_on != null and .due_on[0:10] > env.TODAY))
                  // empty | [.title, .due_on[0:10]] | @tsv')"
          if [ -z "$milestone" ]; then
            echo "::error::No open milestone due after today to file the alert under"
            exit 1
          fi
          IFS=$'\t' read -r milestone_title due <<< "$milestone"
          alert="$work/alert.json"
          python3 tools/excel_runner_watch.py watch --runs "$work/runs.json" \
            --jobs-dir "$work/jobs" --now "$(date -u +%FT%TZ)" --milestone-due "$due" \
            --output "$alert" | tee -a "$GITHUB_STEP_SUMMARY"
          title="$(python3 -c 'import sys; sys.path.insert(0, "tools"); import excel_runner_watch; print(excel_runner_watch.ALERT_TITLE)')"
          open="$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -f "$alert" ]; then
            jq -j .body "$alert" > "$work/alert.md"
            if [ -n "$open" ]; then
              gh issue edit "$open" --body-file "$work/alert.md"
            else
              assignee="$(python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "tools"); import check_issues; print(check_issues.configured_assignee(Path(".")))')"
              gh issue create --title "$title" --body-file "$work/alert.md" \
                --assignee "$assignee" --label P2 --label ci --milestone "$milestone_title"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --reason completed \
              --comment "The scheduled runner check of $(date -u '+%F %H:%M') UTC found nothing waiting. Closed automatically."
          fi
