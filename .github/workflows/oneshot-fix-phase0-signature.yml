name: One-shot Phase 0 signature correction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneshot-fix-phase0-signature.yml"

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Correct frozen Phase 0 signature
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("docs/V1_0_0_IMPLEMENTATION_PLAN.md")
          text = p.read_text(encoding="utf-8")

          old = '''| 3 | strict accuracy gate | FAIL | `STALE EVIDENCE`, exactly 2 mismatches |
          | 4 | gate blocks without references | FAIL | same stale-evidence cause and same 2 mismatches |
          | 5 | source claims vs registries | PASS | — |'''
          new = '''| 3 | strict accuracy gate | FAIL | `STALE EVIDENCE`, exactly 2 mismatches |
          | 4 | gate blocks without references | PASS | fixture isolates provenance, forces the reference helper unavailable, requires active tail contracts to become `PENDING`, and requires a non-zero gate exit in both strict and development modes |
          | 5 | source claims vs registries | PASS | — |'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one signature-table anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''Every Phase 0 commit compares the ordered tuple `(label, result, failure class, mismatch count, mismatch paths)` with this signature. Any difference is a regression despite the already-red top line. Runs 166 through 171 preserve the invariant.
          '''
          new = '''Every Phase 0 commit compares the ordered tuple `(label, result, failure class, mismatch count, mismatch paths)` with this signature. Any unexplained difference is a regression despite the already-red top line.

          **Frozen-signature revision — 2026-09-16.** Commit `8a3bbb8` intentionally changed only the expected result of `gate blocks without references`: that fixture now supplies a synthetic clean-provenance seam so live stale provenance cannot mask the helper-degradation path it exists to test. It must PASS only when the simulated missing helper leaves active tail contracts `PENDING` and the gate exits non-zero in both strict and development modes. Manifest/provenance correctness remains independently mutation-tested. Runs 166 through 171 preserve the earlier pre-isolation signature; from `8a3bbb8` onward, the table above is the frozen Phase 0 signature. Reverting step 4 to a stale-provenance FAIL is itself a regression because it means the degradation path is masked again.
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one invariant-prose anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''1. Before exporting anything, reproduce the frozen Phase 0 signature exactly: five PASS lines, two stale-evidence FAIL lines, exactly two mismatches, and only the two frozen paths. In the same run, verify #29's Excel-free mechanism and #22's transition guard.'''
          new = '''1. Before exporting anything, reproduce the frozen Phase 0 signature exactly: six PASS lines, one stale-evidence FAIL line, exactly two mismatches on the strict accuracy gate, and only the two frozen paths. The helper-degradation fixture must PASS by exercising its synthetic clean-provenance seam and proving active tail contracts become `PENDING` with a non-zero gate exit in both modes. In the same run, verify #29's Excel-free mechanism and #22's transition guard.'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one Phase 1 signature anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          p.write_text(text, encoding="utf-8")
          PY
      - name: Commit correction and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneshot-fix-phase0-signature.yml
          git add docs/V1_0_0_IMPLEMENTATION_PLAN.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes staged"; exit 1; }
          git commit -m "docs(plan): refresh frozen Phase 0 signature after P0.3"
          git push origin HEAD:main
