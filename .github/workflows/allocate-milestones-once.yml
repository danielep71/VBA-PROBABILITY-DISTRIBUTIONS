name: Allocate release milestones once

on:
  push:
    paths:
      - ".github/workflows/allocate-milestones-once.yml"

permissions:
  contents: read
  issues: write

jobs:
  allocate:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.1.1 and allocate issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: 'all', per_page: 100
            });

            const v110 = milestones.find(m => m.title === 'v1.1.0');
            if (!v110) core.setFailed('v1.1.0 milestone is missing');

            const v111Description = `Post-v1.1.0 maintenance and assurance-tightening milestone. Focuses on non-blocking numerical-governance improvements that should not delay the stabilization release, especially auditing excessive accuracy-contract headroom, documenting deliberate threshold floors, and improving regression sensitivity without changing the supported public API.`;

            let v111 = milestones.find(m => m.title === 'v1.1.1');
            if (v111) {
              const r = await github.rest.issues.updateMilestone({
                owner, repo,
                milestone_number: v111.number,
                title: 'v1.1.1',
                description: v111Description,
                state: 'open'
              });
              v111 = r.data;
            } else {
              const r = await github.rest.issues.createMilestone({
                owner, repo,
                title: 'v1.1.1',
                description: v111Description,
                state: 'open'
              });
              v111 = r.data;
            }

            const closedToV110 = [2,3,4,5,6,8,9,10,12,15,17,18,21];
            const openToV110 = [11,13,14,20,22,23,24];
            const openToV111 = [7];

            for (const issue_number of [...closedToV110, ...openToV110]) {
              await github.rest.issues.update({
                owner, repo, issue_number, milestone: v110.number
              });
            }

            for (const issue_number of openToV111) {
              await github.rest.issues.update({
                owner, repo, issue_number, milestone: v111.number
              });
            }

            // Remove the accidental temporary issue created while probing milestone writes.
            try {
              const q = await github.graphql(`
                query($owner:String!, $repo:String!, $number:Int!) {
                  repository(owner:$owner, name:$repo) {
                    issue(number:$number) { id title }
                  }
                }`, { owner, repo, number: 25 });
              if (q.repository.issue && q.repository.issue.title === 'TEMP-MILESTONE-SETUP-DO-NOT-USE') {
                await github.graphql(`
                  mutation($id:ID!) { deleteIssue(input:{issueId:$id}) { clientMutationId } }
                `, { id: q.repository.issue.id });
                core.info('Deleted temporary issue #25');
              }
            } catch (e) {
              core.warning(`Could not delete temporary issue #25: ${e.message}`);
            }

            for (const issue_number of closedToV110) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number });
              if (data.state !== 'closed' || data.milestone?.number !== v110.number) {
                core.setFailed(`Closed issue #${issue_number} not correctly assigned to v1.1.0`);
                return;
              }
            }

            for (const issue_number of openToV110) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number });
              if (data.state !== 'open' || data.milestone?.number !== v110.number) {
                core.setFailed(`Open issue #${issue_number} not correctly assigned to v1.1.0`);
                return;
              }
            }

            for (const issue_number of openToV111) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number });
              if (data.state !== 'open' || data.milestone?.number !== v111.number) {
                core.setFailed(`Open issue #${issue_number} not correctly assigned to v1.1.1`);
                return;
              }
            }

            core.info(`v1.1.0 milestone #${v110.number}: ${closedToV110.length} closed + ${openToV110.length} open issues assigned`);
            core.info(`v1.1.1 milestone #${v111.number}: ${openToV111.length} open issue assigned`);
