name: Create v1.1.0 Milestone

on:
  push:
    paths:
      - ".github/workflows/create-v1.1.0-milestone.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update v1.1.0 milestone
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'v1.1.0';
            const description = `First formal stabilization milestone for VBA-PROBABILITY-DISTRIBUTIONS. Targets closure of release-blocking numerical-correctness defects and the assurance gaps that could let them escape detection: Gamma/Chi-square underflow and subnormal paths, incomplete-gamma small-shape accuracy and complement stability, contract coverage, permanent regression cases, and CI/evidence integrity. v1.1.0 should ship only when all P1 items are closed, agreed P2 release gates are resolved, accuracy contracts and holdouts are green, and the Excel VBA regression suite passes completely.`;

            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            const existing = milestones.find(m => m.title === title);
            let milestone;

            if (existing) {
              const response = await github.rest.issues.updateMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone_number: existing.number,
                title,
                description,
                state: 'open'
              });
              milestone = response.data;
            } else {
              const response = await github.rest.issues.createMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                description,
                state: 'open'
              });
              milestone = response.data;
            }

            core.info(`Milestone #${milestone.number}: ${milestone.title}`);
            core.info(milestone.html_url);
