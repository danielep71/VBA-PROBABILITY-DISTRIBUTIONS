name: Accuracy Gate

# The accuracy gate is pure Python and needs no Excel, so unlike the Excel/VBA
# regression harness (self-hosted, not reproducible by outsiders) it runs on a
# standard GitHub-hosted runner and CAN be reproduced by anyone. It checks that
# the committed benchmark grid still meets every active accuracy contract, in
# STRICT mode, and that the gate itself still blocks when its reference helper
# is unavailable.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  push:
    branches: [main, "release/**"]
  # Run on every main push and PR: repository metadata and tools are inputs
  # to the assurance checks too. This job is a required status check on main
  # (ruleset 'Protect main'; see #31).
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: accuracy-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The CI interpreter, an exact patch release, for every job; tools/README.md
  # ("Python versions") lists where it is set. benchmark/requirements-ci.txt
  # holds pure-Python wheels, so a patch bump leaves the reference stack as is.
  PYTHON_VERSION: "3.12.16"

jobs:
  select:
    name: Select accuracy proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run the tests/ unit tests
        # Every module under tests/ runs on every event, before selection:
        # change selection, issue triage and CI test coverage are all cheap,
        # offline and independent of the selected proof depth.
        run: python -m unittest discover -s tests
      - name: Verify every tracked test file runs in CI
        # Fails when a tracked test_*.py is executed by no workflow step and
        # no runner list on every pull request (tools/check_ci_test_coverage.py).
        run: python tools/check_ci_test_coverage.py --root . --summary "$GITHUB_STEP_SUMMARY"
      - name: Select proofs for the complete change
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: >-
          python tools/select_accuracy_checks.py --event "$EVENT_NAME"
          --base "$BASE_SHA" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  accuracy-core:
    name: Live accuracy evidence and evaluator checks
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # PRs use the base of the synthetic merge; pushes include EVERY new commit.
      PROVENANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manifest provenance is checked per commit and its negative controls
          # include historical rebind/export/restoration commits. A depth-1 PR
          # checkout makes those controls silently untestable and also weakens
          # exact-restoration detection. Keep the commit graph available.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install reference dependencies
        id: deps
        # Keep the hosted oracle and symbolic derivation on tested versions.
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          -r benchmark/requirements-ci.txt

      - name: Verify the evaluation tooling itself
        working-directory: benchmark
        # These run BEFORE the gate deliberately. compute_errors.py and
        # analyze_holdout.py both read their semantics from _contract_eval.py,
        # so a broken evaluator makes every verdict below meaningless rather
        # than merely wrong. Fail on the tooling first.
        # ONE list, not two. This step previously enumerated the tooling
        # scripts by hand while refresh_evidence.py ran test_evidence_tools.py,
        # and the two lists diverged: test_igamma_parity.py was added to the
        # shim and never to this step, so the parity drift detector ran
        # locally and never in CI. Calling the shim here makes the local
        # signature and full hosted runs execute the identical set. Metadata-only
        # CI selects live checks from that same list; local runs stay full.
        # Add new tooling checks to test_evidence_tools.py only.
        env:
          FULL_PROOFS: ${{ needs.select.outputs.full }}
        run: |
          if [[ "$FULL_PROOFS" == "true" ]]; then
            python test_evidence_tools.py
          else
            python test_evidence_tools.py --checks-only
          fi

      - name: Run strict accuracy gate on the committed grid
        working-directory: benchmark
        # No --allow-known-limitations: strict mode. Non-zero exit (blocking
        # FAIL, an unevaluated active contract, or stale main/holdout provenance)
        # fails the job. Main provenance is checked first so a known stale-main
        # state keeps its exact diagnostic; a clean main binding cannot advance
        # to numerical certification while the holdout is unbound or stale.
        run: python compute_errors.py --out "${RUNNER_TEMP}/accuracy_summary.md"

      - name: Verify the committed accuracy summary matches the committed grid
        working-directory: benchmark
        # The summary is release evidence, so a stale copy must not survive a
        # push. Regenerate it in place and fail on any diff, exactly as the
        # README contract table is checked below.
        run: |
          python compute_errors.py --out accuracy_summary.md
          git diff --exit-code accuracy_summary.md

      - name: Verify the gate blocks when the reference helper is unavailable
        working-directory: benchmark
        # Guards the "active contract silently downgraded to non-blocking
        # characterization" defect: this must exit 0 (meaning the gate correctly
        # exits non-zero and marks the contracts PENDING when the helper is gone).
        run: python test_gate_degradation.py

      - name: Verify the generated README table matches the contract registry
        working-directory: benchmark
        # render_contract_table.py splices accuracy_contracts.csv into README.md
        # between the generated markers; a non-empty diff means the committed
        # README drifted from the authoritative registry (P2-01).
        run: |
          python render_contract_table.py --write
          git diff --exit-code README.md

      - name: Verify source headers do not restate measured thresholds
        working-directory: benchmark
        # P2-01 failsafe: measured thresholds live in accuracy_contracts.csv, not
        # duplicated in VBA headers where they drift out of date.
        run: python check_source_thresholds.py

      - name: Test the holdout analyzer
        # Keep fixture proofs running even when a numerical verdict fails,
        # provided dependencies installed and the run was not cancelled.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: benchmark/holdout
        # The holdout analyzer has its own metric semantics and its own fixtures.
        # Both drifted unnoticed once already: fixtures pinned df 5E5 as "beyond
        # the F envelope", which stopped being true when PROB_F_MAX_DF rose to
        # 1E10 and silently inverted two assertions (CR-P1-03).
        run: python test_analyze_holdout.py

      - name: Verify the independent holdout against the current registry
        working-directory: benchmark/holdout
        # The analyzer reads accuracy_contracts.csv, so this catches a registry
        # tightened without re-exporting the holdout - the CR-P1-03 defect, where
        # the committed summary reported PASS against superseded thresholds while
        # a rerun would have failed two Poisson contracts by 12.9x and 550x.
        #
        # NOTE the diff alone would NOT have caught that: the stale summary was
        # internally consistent. The earlier strict-gate step now verifies the
        # dedicated holdout source binding before this analyzer can contribute a
        # release verdict; this step then checks the current registry and stops a
        # committed summary that disagrees with it.
        run: |
          python analyze_holdout.py
          git diff --exit-code holdout_summary.md

      - name: "Validate the retained Excel certification record against this commit (#47)"
        # The fixture proofs above test the validator; this step validates the
        # committed record itself as live evidence. Its exact candidate must
        # exist, its certified sources must match this commit, and every grid it
        # claims as exported must match the committed bytes (sha256) and an
        # exact line-ending form of them (raw_sha256). Full history is required.
        if: ${{ !cancelled() }}
        working-directory: benchmark
        run: python check_excel_certification.py --fetch-candidate --record excel_regression_record.json --require-pass

      - name: "Verify the root README assurance block matches committed evidence (#28)"
        # Runs last, after every summary it reads has been regenerated and
        # diffed above. The badges, the "Assurance at a glance" table and the
        # evidence-state list are rendered from committed records only; any
        # hand edit, a stale Excel record or binding, or an input that
        # contradicts another fails here. Incomplete certification must be
        # owned by an open blocker in release_readiness.json.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: benchmark
        run: python render_readme_assurance.py --check

  study:
    name: Positive-ratio study proofs
    needs: select
    if: needs.select.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install reference dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes -r benchmark/requirements-ci.txt
      - name: "Verify the study analyzer for #13"
        working-directory: benchmark/positive_ratio_subnormal
        # The positive-ratio analyzer defines the evidence contract for
        # #13: what a row means, how the exact standardized argument is
        # reconstructed, how output representability is classified. It has
        # produced five defects during development - a missing density
        # Jacobian, a missing candidate recorded as zero error, an absent
        # overflowed-output class, an ambiguous binding shape and an oracle
        # precision inconsistency - none of which CI would have caught.
        #
        # The --claims runs gate the preregistered holdout verdicts themselves.
        # They exit non-zero on a rejected or pending claim, so a holdout that
        # stops supporting a registered cutoff turns the gate red rather than
        # requiring somebody to read the output.
        # Runs while #13 is active; remove when the study closes.
        run: |
          python test_analyze_positive_ratio_subnormal.py
          python analyze_positive_ratio_subnormal.py gamma_probe.csv > /dev/null
          python analyze_positive_ratio_subnormal.py chisquare_probe.csv > /dev/null
          python analyze_positive_ratio_subnormal.py gamma_holdout.csv --claims
          python analyze_positive_ratio_subnormal.py chisquare_holdout.csv --claims


  accuracy-gate:
    name: Strict accuracy gate (pure Python, no Excel)
    needs: [select, accuracy-core, study]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to succeed
        env:
          SELECTION: ${{ needs.select.result }}
          FULL_PROOFS: ${{ needs.select.outputs.full }}
          CORE: ${{ needs.accuracy-core.result }}
          STUDY: ${{ needs.study.result }}
        run: |
          test "$SELECTION" = success
          test "$CORE" = success
          case "$FULL_PROOFS" in
            true) test "$STUDY" = success ;;
            false) test "$STUDY" = skipped ;;
            *) exit 1 ;;
          esac
