name: Accuracy Gate

# The accuracy gate is pure Python and needs no Excel, so unlike the Excel/VBA
# regression harness (self-hosted, not reproducible by outsiders) it runs on a
# standard GitHub-hosted runner and CAN be reproduced by anyone. It checks that
# the committed benchmark grid still meets every active accuracy contract, in
# STRICT mode, and that the gate itself still blocks when its reference helper
# is unavailable.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmark/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/accuracy-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "benchmark/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/accuracy-gate.yml"

concurrency:
  group: accuracy-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  accuracy-gate:
    name: Strict accuracy gate (pure Python, no Excel)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reference dependencies
        run: python -m pip install --upgrade pip mpmath

      - name: "Verify the study analyzer for #13"
        working-directory: benchmark/positive_ratio_subnormal
        # The positive-ratio analyzer defines the evidence contract for
        # #13: what a row means, how the exact standardized argument is
        # reconstructed, how output representability is classified. It has
        # produced five defects during development - a missing density
        # Jacobian, a missing candidate recorded as zero error, an absent
        # overflowed-output class, an ambiguous binding shape and an oracle
        # precision inconsistency - none of which CI would have caught.
        #
        # The --claims runs gate the preregistered holdout verdicts themselves.
        # They exit non-zero on a rejected or pending claim, so a holdout that
        # stops supporting a registered cutoff turns the gate red rather than
        # requiring somebody to read the output.
        # Runs while #13 is active; remove when the study closes.
        run: |
          python test_analyze_positive_ratio_subnormal.py
          python analyze_positive_ratio_subnormal.py gamma_probe.csv > /dev/null
          python analyze_positive_ratio_subnormal.py chisquare_probe.csv > /dev/null
          python analyze_positive_ratio_subnormal.py gamma_holdout.csv --claims
          python analyze_positive_ratio_subnormal.py chisquare_holdout.csv --claims

      - name: Verify the evaluation tooling itself
        working-directory: benchmark
        # These run BEFORE the gate deliberately. compute_errors.py and
        # analyze_holdout.py both read their semantics from _contract_eval.py,
        # so a broken evaluator makes every verdict below meaningless rather
        # than merely wrong. Fail on the tooling first.
        run: |
          python test_contract_eval.py
          python test_manifest.py

      - name: Run strict accuracy gate on the committed grid
        working-directory: benchmark
        # No --allow-known-limitations: strict mode. Non-zero exit (blocking
        # FAIL, or an unevaluated active contract) fails the job.
        run: python compute_errors.py --out "${RUNNER_TEMP}/accuracy_summary.md"

      - name: Verify the committed accuracy summary matches the committed grid
        working-directory: benchmark
        # The summary is release evidence, so a stale copy must not survive a
        # push. Regenerate it in place and fail on any diff, exactly as the
        # README contract table is checked below.
        run: |
          python compute_errors.py --out accuracy_summary.md
          git diff --exit-code accuracy_summary.md

      - name: Verify the gate blocks when the reference helper is unavailable
        working-directory: benchmark
        # Guards the "active contract silently downgraded to non-blocking
        # characterization" defect: this must exit 0 (meaning the gate correctly
        # exits non-zero and marks the contracts PENDING when the helper is gone).
        run: python test_gate_degradation.py

      - name: Verify the generated README table matches the contract registry
        working-directory: benchmark
        # render_contract_table.py splices accuracy_contracts.csv into README.md
        # between the generated markers; a non-empty diff means the committed
        # README drifted from the authoritative registry (P2-01).
        run: |
          python render_contract_table.py --write
          git diff --exit-code README.md

      - name: Verify source headers do not restate measured thresholds
        working-directory: benchmark
        # P2-01 failsafe: measured thresholds live in accuracy_contracts.csv, not
        # duplicated in VBA headers where they drift out of date.
        run: python check_source_thresholds.py

      - name: Test the holdout analyzer
        working-directory: benchmark/holdout
        # The holdout analyzer has its own metric semantics and its own fixtures.
        # Both drifted unnoticed once already: fixtures pinned df 5E5 as "beyond
        # the F envelope", which stopped being true when PROB_F_MAX_DF rose to
        # 1E10 and silently inverted two assertions (CR-P1-03).
        run: python test_analyze_holdout.py

      - name: Verify the independent holdout against the current registry
        working-directory: benchmark/holdout
        # The analyzer reads accuracy_contracts.csv, so this catches a registry
        # tightened without re-exporting the holdout - the CR-P1-03 defect, where
        # the committed summary reported PASS against superseded thresholds while
        # a rerun would have failed two Poisson contracts by 12.9x and 550x.
        #
        # NOTE the diff alone would NOT have caught that: the stale summary was
        # internally consistent. Running the analyzer against the CURRENT
        # registry is what does the work; the diff then stops a summary that
        # disagrees with it from being committed. Neither step binds the holdout
        # OBSERVATIONS to source - see the holdout provenance issue.
        run: |
          python analyze_holdout.py
          git diff --exit-code holdout_summary.md
