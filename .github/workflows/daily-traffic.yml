# ---------------------------------------------------------------------------
# Daily traffic export
#
#   Reads the GitHub traffic API for this repository and appends a daily
#   snapshot to CSV files on the orphan `traffic-history` branch. It also
#   writes data/badges/clones.json, visitors.json and visits.json there, the
#   shields.io endpoints behind the README clones, visitors and visits badges.
#
#   Data retention
#     GitHub retains traffic data for 14 days only. This workflow exists to
#     keep a longer history. The `traffic-history` branch is public, and the
#     data it holds — view counts, clone counts, referrers, popular paths — is
#     the same aggregate data GitHub already exposes to repository admins. It
#     contains no identifying information about individual visitors.
#
#   Credentials
#     The traffic API requires `Administration: read`. A GitHub App installed
#     on this repository provides it. Its client ID and private key are stored
#     in the repository-level `analytics` environment as TRAFFIC_APP_CLIENT_ID
#     and TRAFFIC_APP_PRIVATE_KEY. Each run mints an installation token scoped
#     to this repository with `administration: read` only; the token expires
#     after an hour and is revoked when the job ends.
#     The environment is not a workflow-identity boundary: any job declaring
#     it may request access, subject to the configured environment protections.
#
#     Rotate the private key immediately if this workflow is ever modified by
#     someone other than me. See SECURITY.md, "Repository automation
#     credentials".
#
#   Scope
#     This is repository analytics. It is not CI. The traffic job, the only one
#     that requests the analytics environment, imports no VBA, runs no tests or
#     accuracy contracts, executes no repository script, and must never be
#     extended to do so. Static checks, the Accuracy Gate and the Excel VBA
#     regression are deliberately separate workflows, so that a high-privilege
#     analytics token is never available to a job that executes repository
#     code. The alert job runs tools/traffic_alert.py on the published history,
#     with no environment and only the workflow token. Its pushes use the workflow token and therefore trigger no other
#     workflow; no CI workflow's push filter matches the traffic-history
#     branch.
# ---------------------------------------------------------------------------

name: Daily traffic export

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Read-only by default; the one job below receives exactly what it uses.
permissions:
  contents: read

env:
  # The CI interpreter, an exact patch release, shared with every workflow that
  # sets up Python; tools/README.md ("Python versions") lists where it is set.
  PYTHON_VERSION: "3.12.16"

concurrency:
  group: daily-traffic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  traffic:
    name: Export GitHub traffic
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Least privilege: contents: write pushes the CSV history to the
    # traffic-history branch. Nothing else is granted; the alert job below
    # opens alert issues.
    permissions:
      contents: write

    # Requests the repository-level analytics environment. Keep this declaration
    # out of every code-executing build, test and release job; the environment
    # name alone does not bind the secret to this workflow identity.
    environment: analytics

    steps:
      # Pinned to a full commit SHA so a moved tag cannot change what runs.
      # Credentials persist because the job pushes to traffic-history; no
      # repository code runs in this job. Only the tip is needed: the history
      # branch is fetched explicitly below.
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Prepare traffic-history branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin traffic-history:traffic-history || true

          if git show-ref --verify --quiet refs/heads/traffic-history; then
            git checkout traffic-history
          else
            git checkout --orphan traffic-history
            git rm -rf . || true
          fi

          mkdir -p data

      # Short-lived installation token for the traffic API, limited to this
      # repository and to administration: read. The client ID is not secret, so
      # it may be stored as an environment variable or as a secret. The action's
      # post step revokes the token when the job ends.
      - name: Mint traffic API token
        id: traffic-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRAFFIC_APP_CLIENT_ID || secrets.TRAFFIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRAFFIC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read

      - name: Fetch GitHub traffic API data
        shell: bash
        env:
          TRAFFIC_API_TOKEN: ${{ steps.traffic-token.outputs.token }}
        run: |
          set -euo pipefail

          if [ -z "${TRAFFIC_API_TOKEN:-}" ]; then
            echo "::error::The GitHub App did not return a traffic API token"
            echo "Check TRAFFIC_APP_CLIENT_ID and TRAFFIC_APP_PRIVATE_KEY in the analytics environment, and that the app is installed on this repository with Administration: read."
            exit 1
          fi

          API_VERSION="2026-03-10"
          REPO="${{ github.repository }}"
          BASE_URL="https://api.github.com/repos/$REPO"

          api_get() {
            local label="$1"
            local url="$2"
            local output="$3"
            local status

            status=$(curl -sS -L \
              -o "$output" \
              -w "%{http_code}" \
              -H "Authorization: Bearer $TRAFFIC_API_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "$url")

            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::$label failed with HTTP $status"
              echo "Response body:"
              head -c 2000 "$output" || true
              echo
              exit 1
            fi
          }

          api_get "Page views" "$BASE_URL/traffic/views?per=day" "/tmp/views.json"
          api_get "Clones" "$BASE_URL/traffic/clones?per=day" "/tmp/clones.json"
          api_get "Top referrers" "$BASE_URL/traffic/popular/referrers" "/tmp/referrers.json"
          api_get "Popular paths" "$BASE_URL/traffic/popular/paths" "/tmp/paths.json"
          api_get "Repository metadata" "$BASE_URL" "/tmp/repo.json"

      - name: Build CSV history
        shell: bash
        run: |
          set -euo pipefail

          python3 << 'PY'
          import csv
          import json
          import os
          from datetime import datetime, timezone

          def load_json(path):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)

          def read_csv(path):
              if not os.path.exists(path):
                  return []
              with open(path, "r", newline="", encoding="utf-8") as f:
                  return list(csv.DictReader(f))

          def write_csv(path, rows, fieldnames):
              directory = os.path.dirname(path)
              if directory:
                  os.makedirs(directory, exist_ok=True)

              with open(path, "w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=fieldnames)
                  writer.writeheader()

                  for row in rows:
                      writer.writerow({field: row.get(field, "") for field in fieldnames})

          def upsert_rows(path, new_rows, fieldnames, key_fields, normalizer=None):
              existing_rows = read_csv(path)

              if normalizer is not None:
                  normalized_rows = []

                  for row in existing_rows:
                      normalized = normalizer(row)

                      if normalized is not None:
                          normalized_rows.append(normalized)

                  existing_rows = normalized_rows

              new_keys = {
                  tuple(str(row.get(key, "")) for key in key_fields)
                  for row in new_rows
              }

              kept_rows = [
                  row for row in existing_rows
                  if tuple(str(row.get(key, "")) for key in key_fields) not in new_keys
              ]

              combined_rows = kept_rows + new_rows

              combined_rows = [
                  row for row in combined_rows
                  if all(str(row.get(key, "")) for key in key_fields)
              ]

              combined_rows.sort(
                  key=lambda row: tuple(str(row.get(key, "")) for key in key_fields)
              )

              write_csv(path, combined_rows, fieldnames)

          def to_int(value, default=0):
              try:
                  return int(value)
              except Exception:
                  return default

          def normalize_traffic_row(row):
              if row.get("snapshot_date"):
                  return {
                      "snapshot_date": row.get("snapshot_date", ""),
                      "snapshot_datetime_utc": row.get("snapshot_datetime_utc", ""),
                      "views_14d": row.get("views_14d", "0"),
                      "unique_views_14d": row.get("unique_views_14d", "0"),
                      "clones_14d": row.get("clones_14d", "0"),
                      "unique_clones_14d": row.get("unique_clones_14d", "0"),
                      "stars": row.get("stars", "0"),
                      "forks": row.get("forks", "0"),
                      "watchers": row.get("watchers", "0"),
                      "open_issues": row.get("open_issues", "0")
                  }

              if row.get("date"):
                  return {
                      "snapshot_date": row.get("date", "")[:10],
                      "snapshot_datetime_utc": row.get("date", ""),
                      "views_14d": row.get("views", "0"),
                      "unique_views_14d": row.get("unique_views", "0"),
                      "clones_14d": row.get("clones", "0"),
                      "unique_clones_14d": row.get("unique_clones", "0"),
                      "stars": row.get("stars", "0"),
                      "forks": row.get("forks", "0"),
                      "watchers": row.get("watchers", "0"),
                      "open_issues": row.get("open_issues", "0")
                  }

              return None

          views = load_json("/tmp/views.json")
          clones = load_json("/tmp/clones.json")
          referrers = load_json("/tmp/referrers.json")
          paths = load_json("/tmp/paths.json")
          repo = load_json("/tmp/repo.json")

          if "views" not in views or "count" not in views:
              raise RuntimeError("Unexpected views API response")

          if "clones" not in clones or "count" not in clones:
              raise RuntimeError("Unexpected clones API response")

          if not isinstance(referrers, list):
              raise RuntimeError("Unexpected referrers API response")

          if not isinstance(paths, list):
              raise RuntimeError("Unexpected popular paths API response")

          if "stargazers_count" not in repo:
              raise RuntimeError("Unexpected repository metadata API response")

          now = datetime.now(timezone.utc)
          snapshot_date = now.date().isoformat()
          snapshot_datetime = now.isoformat(timespec="seconds")

          traffic_fields = [
              "snapshot_date",
              "snapshot_datetime_utc",
              "views_14d",
              "unique_views_14d",
              "clones_14d",
              "unique_clones_14d",
              "stars",
              "forks",
              "watchers",
              "open_issues"
          ]

          traffic_row = {
              "snapshot_date": snapshot_date,
              "snapshot_datetime_utc": snapshot_datetime,
              "views_14d": to_int(views.get("count", 0)),
              "unique_views_14d": to_int(views.get("uniques", 0)),
              "clones_14d": to_int(clones.get("count", 0)),
              "unique_clones_14d": to_int(clones.get("uniques", 0)),
              "stars": to_int(repo.get("stargazers_count", 0)),
              "forks": to_int(repo.get("forks_count", 0)),
              "watchers": to_int(repo.get("subscribers_count", 0)),
              "open_issues": to_int(repo.get("open_issues_count", 0))
          }

          upsert_rows(
              "data/traffic.csv",
              [traffic_row],
              traffic_fields,
              ["snapshot_date"],
              normalize_traffic_row
          )

          daily_fields = [
              "date",
              "views",
              "unique_views",
              "clones",
              "unique_clones"
          ]

          daily = {}

          for item in views.get("views", []):
              day = str(item.get("timestamp", ""))[:10]

              if not day:
                  continue

              daily.setdefault(day, {
                  "date": day,
                  "views": 0,
                  "unique_views": 0,
                  "clones": 0,
                  "unique_clones": 0
              })

              daily[day]["views"] = to_int(item.get("count", 0))
              daily[day]["unique_views"] = to_int(item.get("uniques", 0))

          for item in clones.get("clones", []):
              day = str(item.get("timestamp", ""))[:10]

              if not day:
                  continue

              daily.setdefault(day, {
                  "date": day,
                  "views": 0,
                  "unique_views": 0,
                  "clones": 0,
                  "unique_clones": 0
              })

              daily[day]["clones"] = to_int(item.get("count", 0))
              daily[day]["unique_clones"] = to_int(item.get("uniques", 0))

          upsert_rows(
              "data/traffic_daily.csv",
              list(daily.values()),
              daily_fields,
              ["date"]
          )

          # README badges: shields.io endpoint JSON files.
          #   clones   total clones recorded in the daily history since
          #            tracking began
          #   visitors unique visitors over GitHub's rolling 14-day window,
          #            from today's snapshot (daily uniques cannot be summed
          #            into a unique count)
          #   visits   cumulative daily unique visitors since tracking began;
          #            a visitor counts once per day they visit
          def compact_count(value):
              if value >= 1000000:
                  return f"{value / 1000000:.1f}M".replace(".0M", "M")
              if value >= 1000:
                  return f"{value / 1000:.1f}k".replace(".0k", "k")
              return str(value)

          def write_badge(name, label, value):
              os.makedirs("data/badges", exist_ok=True)

              with open(f"data/badges/{name}.json", "w", encoding="utf-8") as f:
                  json.dump(
                      {
                          "schemaVersion": 1,
                          "label": label,
                          "message": compact_count(value),
                          "color": "217346"
                      },
                      f
                  )
                  f.write("\n")

          total_clones = sum(
              to_int(row.get("clones", 0))
              for row in read_csv("data/traffic_daily.csv")
          )

          total_visits = sum(
              to_int(row.get("unique_views", 0))
              for row in read_csv("data/traffic_daily.csv")
          )

          write_badge("clones", "clones", total_clones)
          write_badge("visits", "visits", total_visits)
          write_badge(
              "visitors",
              "visitors (14d)",
              to_int(traffic_row["unique_views_14d"])
          )

          referrer_fields = [
              "snapshot_date",
              "rank",
              "referrer",
              "count",
              "uniques"
          ]

          existing_referrers = [
              row for row in read_csv("data/referrers.csv")
              if row.get("snapshot_date") != snapshot_date
          ]

          referrer_rows = []

          for rank, item in enumerate(referrers, start=1):
              referrer_rows.append({
                  "snapshot_date": snapshot_date,
                  "rank": rank,
                  "referrer": item.get("referrer", ""),
                  "count": to_int(item.get("count", 0)),
                  "uniques": to_int(item.get("uniques", 0))
              })

          combined_referrers = existing_referrers + referrer_rows
          combined_referrers.sort(
              key=lambda row: (
                  row.get("snapshot_date", ""),
                  to_int(row.get("rank", 999))
              )
          )

          write_csv(
              "data/referrers.csv",
              combined_referrers,
              referrer_fields
          )

          path_fields = [
              "snapshot_date",
              "rank",
              "path",
              "title",
              "count",
              "uniques"
          ]

          existing_paths = [
              row for row in read_csv("data/popular_paths.csv")
              if row.get("snapshot_date") != snapshot_date
          ]

          path_rows = []

          for rank, item in enumerate(paths, start=1):
              path_rows.append({
                  "snapshot_date": snapshot_date,
                  "rank": rank,
                  "path": item.get("path", ""),
                  "title": item.get("title", ""),
                  "count": to_int(item.get("count", 0)),
                  "uniques": to_int(item.get("uniques", 0))
              })

          combined_paths = existing_paths + path_rows
          combined_paths.sort(
              key=lambda row: (
                  row.get("snapshot_date", ""),
                  to_int(row.get("rank", 999))
              )
          )

          write_csv(
              "data/popular_paths.csv",
              combined_paths,
              path_fields
          )
          PY

      - name: Commit traffic history
        shell: bash
        run: |
          set -euo pipefail

          git add data/

          if git diff --cached --quiet; then
            echo "No traffic changes to commit"
          else
            git commit -m "Update traffic history"
          fi

          git push origin HEAD:traffic-history

  alert:
    name: Traffic alert
    needs: traffic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No environment: this job never receives the analytics token. It runs
    # tools/traffic_alert.py on the history the traffic job pushed and opens at
    # most one issue per snapshot, filed so that Issue triage accepts it.
    permissions:
      contents: read
      issues: write
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Check out traffic-history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: traffic-history
          path: history
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Open the alert issue, if one is due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The issue-form assignee, which Issue triage requires on every issue.
          assignee="$(python -c 'import sys; from pathlib import Path; sys.path.insert(0, "source/tools"); import check_issues; print(check_issues.configured_assignee(Path("source")))')"
          # The open milestone with the earliest due date after today (UTC).
          milestone="$(TODAY="$(date -u +%F)" gh api \
            "repos/$GH_REPO/milestones?state=open&sort=due_on&direction=asc" \
            --jq 'first(.[] | select(.due_on != null and .due_on[0:10] > env.TODAY))
                  // empty | [.title, .due_on[0:10]] | @tsv')"
          if [ -z "$milestone" ]; then
            echo "::error::No open milestone due after today to file the alert under"
            exit 1
          fi
          IFS=$'\t' read -r title due <<< "$milestone"
          alert="$RUNNER_TEMP/alert.json"
          python source/tools/traffic_alert.py \
            --data history/data --milestone-due "$due" --output "$alert"
          [ -f "$alert" ] || exit 0
          issue_title="$(jq -r .title "$alert")"
          jq -j .body "$alert" > "$RUNNER_TEMP/alert.md"
          existing="$(gh issue list --state all --search "\"$issue_title\" in:title" \
            --json title --jq "map(select(.title == \"$issue_title\")) | length")"
          if [ "$existing" != "0" ]; then
            echo "An issue titled \"$issue_title\" already exists."
            exit 0
          fi
          gh issue create --title "$issue_title" --body-file "$RUNNER_TEMP/alert.md" \
            --assignee "$assignee" --label P3 --label repository --milestone "$title"
