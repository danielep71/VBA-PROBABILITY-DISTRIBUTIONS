name: One-shot remediate Codex findings

on:
  push:
    branches: [fix/bot-review-p0-controls]
    paths:
      - ".github/workflows/oneshot-fix-bot-review.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')

          # 1. write_manifest.py: byte-identical-grid exception must consume the
          # full canonical exact-SHA validator, not merely trust exported=true.
          p = root / 'benchmark/write_manifest.py'
          text = p.read_text(encoding='utf-8')
          old = '''from _manifest import (build_manifest, build_holdout_manifest, repo_root,\n                       MANIFEST_NAME, HOLDOUT_MANIFEST_NAME)\n'''
          new = old + '''from excel_certification import CertificationError, validate_record\n'''
          if text.count(old) != 1:
              raise SystemExit('write_manifest import anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''    record = os.path.join(root, RECORD_FILE)\n    if os.path.exists(record):\n        try:\n            with open(record, encoding="utf-8") as f:\n                rec = json.load(f)\n            entry = (rec.get("grids") or {}).get(rel)\n            if entry and entry.get("exported") is True:\n                return False, ""\n        except (OSError, ValueError):\n            pass\n    return True, f"{rel} is byte-identical to HEAD"\n'''
          new = '''    record = os.path.join(root, RECORD_FILE)\n    if os.path.exists(record):\n        try:\n            with open(record, encoding="utf-8") as f:\n                rec = json.load(f)\n            validate_record(\n                rec, root, policy_ref="HEAD", evidence_ref="HEAD",\n                require_pass=True, require_grid=rel,\n            )\n            return False, ""\n        except (OSError, ValueError, CertificationError):\n            pass\n    return True, f"{rel} is byte-identical to HEAD"\n'''
          if text.count(old) != 1:
              raise SystemExit('write_manifest export-record anchor mismatch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 2. Public API baseline edits must themselves trigger the Accuracy Gate.
          p = root / '.github/workflows/accuracy-gate.yml'
          text = p.read_text(encoding='utf-8')
          old = '''      - "tests/**"\n      - ".github/workflows/accuracy-gate.yml"\n'''
          new = '''      - "tests/**"\n      - "docs/PUBLIC_API.txt"\n      - ".github/workflows/accuracy-gate.yml"\n'''
          if text.count(old) != 1:
              raise SystemExit('accuracy-gate path-filter anchor mismatch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 3. Verification-depth wiring must compare complete command tuples,
          # including selectors/modes, and Excel certification is now mandatory.
          p = root / 'benchmark/check_verification_depth.py'
          text = p.read_text(encoding='utf-8')
          old = '''def _shim_commands(text: str) -> set[str]:\n    """Extract first string element from tuple entries in `commands = (...)`."""\n    tree = ast.parse(text)\n    found: set[str] = set()\n    for node in ast.walk(tree):\n        if not isinstance(node, ast.Assign):\n            continue\n        if not any(isinstance(t, ast.Name) and t.id == "commands" for t in node.targets):\n            continue\n        if not isinstance(node.value, (ast.Tuple, ast.List)):\n            continue\n        for item in node.value.elts:\n            if isinstance(item, (ast.Tuple, ast.List)) and item.elts:\n                first = item.elts[0]\n                if isinstance(first, ast.Constant) and isinstance(first.value, str):\n                    found.add(first.value)\n    return found\n'''
          new = '''def _command_tuple(command: str) -> tuple[str, ...]:\n    parts = tuple(shlex.split(command))\n    if not parts:\n        raise ValueError("empty command")\n    if parts[0] in {"python", "python3"}:\n        if len(parts) < 2:\n            raise ValueError(f"python command has no script: {command!r}")\n        parts = parts[1:]\n    return parts\n\n\ndef _shim_commands(text: str) -> set[tuple[str, ...]]:\n    """Extract complete constant command tuples from `commands = (...)`."""\n    tree = ast.parse(text)\n    found: set[tuple[str, ...]] = set()\n    for node in ast.walk(tree):\n        if not isinstance(node, ast.Assign):\n            continue\n        if not any(isinstance(t, ast.Name) and t.id == "commands" for t in node.targets):\n            continue\n        if not isinstance(node.value, (ast.Tuple, ast.List)):\n            continue\n        for item in node.value.elts:\n            if not isinstance(item, (ast.Tuple, ast.List)) or not item.elts:\n                continue\n            values = []\n            for element in item.elts:\n                if not isinstance(element, ast.Constant) or not isinstance(element.value, str):\n                    values = []\n                    break\n                values.append(element.value)\n            if values:\n                found.add(tuple(values))\n    return found\n'''
          if text.count(old) != 1:
              raise SystemExit('verification-depth shim-parser anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''        proof = control.get("proof_command")\n        if isinstance(proof, str) and proof.strip():\n            try:\n                proof_script = _script_from_command(proof)\n            except ValueError:\n                proof_script = ""\n            if proof_script and proof_script not in shim_commands:\n                failures.append(\n                    f"{cid}: proof {proof_script} is not wired into test_evidence_tools.py"\n                )\n'''
          new = '''        proof = control.get("proof_command")\n        if isinstance(proof, str) and proof.strip():\n            try:\n                proof_tuple = _command_tuple(proof)\n            except ValueError as exc:\n                failures.append(f"{cid}: {exc}")\n                proof_tuple = ()\n            if proof_tuple and proof_tuple not in shim_commands:\n                failures.append(\n                    f"{cid}: complete proof command {shlex.join(proof_tuple)} "\n                    "is not wired into test_evidence_tools.py"\n                )\n'''
          if text.count(old) != 1:
              raise SystemExit('verification-depth proof-comparison anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''        "source-threshold-single-source", "holdout-analyzer-semantics",\n    }\n'''
          new = '''        "source-threshold-single-source", "holdout-analyzer-semantics",\n        "excel-exact-sha-certification",\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('verification-depth required-set anchor mismatch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 4. Strengthen the manifest fixture so malformed/incorrect canonical
          # records cannot bypass the byte-identical-grid writer interlock.
          p = root / 'benchmark/test_manifest_provenance.py'
          text = p.read_text(encoding='utf-8')
          old = '''def case_helper_record_wrong_grid(tmp):\n    write(tmp, G.EXPORT_RECORD, export_record(tmp, [HOLD_G]))\n    return helper(tmp)\n\n\n_stale, _why = with_repo(case_helper_no_export)\n'''
          new = '''def case_helper_record_wrong_grid(tmp):\n    write(tmp, G.EXPORT_RECORD, export_record(tmp, [HOLD_G]))\n    return helper(tmp)\n\n\ndef case_helper_record_bad_hash(tmp):\n    write(tmp, G.EXPORT_RECORD, export_record(tmp, [MAIN_G], break_hash=True))\n    return helper(tmp)\n\n\ndef case_helper_record_missing_field(tmp):\n    write(tmp, G.EXPORT_RECORD, export_record(tmp, [MAIN_G], drop_field="environment"))\n    return helper(tmp)\n\n\n_stale, _why = with_repo(case_helper_no_export)\n'''
          if text.count(old) != 1:
              raise SystemExit('manifest helper-fixture anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''check(with_repo(case_helper_record_wrong_grid)[0] is True,\n      "an export record naming a different grid must not clear the check")\n\n# The real writer, on this repository: the grid is committed and unchanged, so\n'''
          new = '''check(with_repo(case_helper_record_wrong_grid)[0] is True,\n      "an export record naming a different grid must not clear the check")\ncheck(with_repo(case_helper_record_bad_hash)[0] is True,\n      "an export record with a mismatched grid digest must not clear the check")\ncheck(with_repo(case_helper_record_missing_field)[0] is True,\n      "a malformed export record must not clear the check")\n\n# The real writer, on this repository: the grid is committed and unchanged, so\n'''
          if text.count(old) != 1:
              raise SystemExit('manifest helper-check anchor mismatch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 5. Add a focused unit fixture for complete-command matching.
          p = root / 'benchmark/test_verification_depth.py'
          p.write_text('''"""Focused fixtures for verification-depth command wiring."""\nimport check_verification_depth as V\n\nshim = """\ncommands = (\n    (\"proof.py\",),\n    (\"proof_mode.py\", \"--negative\", \"strict\"),\n)\n"""\nfound = V._shim_commands(shim)\nassert (\"proof.py\",) in found\nassert (\"proof_mode.py\", \"--negative\", \"strict\") in found\nassert (\"proof_mode.py\",) not in found\nassert V._command_tuple(\"python3 proof_mode.py --negative strict\") == (\n    \"proof_mode.py\", \"--negative\", \"strict\"\n)\nassert V._command_tuple(\"proof.py\") == (\"proof.py\",)\nprint(\"PASS: verification-depth command wiring fixtures (complete tuples, arguments preserved)\")\n''', encoding='utf-8')

          # Run the new focused fixture before the meta-check in the pre-gate shim.
          p = root / 'benchmark/test_evidence_tools.py'
          text = p.read_text(encoding='utf-8')
          old = '''    ("holdout/test_analyze_holdout.py",),\n    ("check_verification_depth.py",),\n'''
          new = '''    ("holdout/test_analyze_holdout.py",),\n    ("test_verification_depth.py",),\n    ("check_verification_depth.py",),\n'''
          if text.count(old) != 1:
              raise SystemExit('test_evidence_tools anchor mismatch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Remove this temporary workflow from the final diff.
          (root / '.github/workflows/oneshot-fix-bot-review.yml').unlink()

      - name: Validate and commit
        run: |
          python benchmark/test_manifest_provenance.py
          python benchmark/test_verification_depth.py
          python benchmark/check_verification_depth.py
          python benchmark/test_public_api.py
          python benchmark/check_public_api.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close post-P0 assurance review gaps"
          git push origin HEAD:fix/bot-review-p0-controls
