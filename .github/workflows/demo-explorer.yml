name: Distribution Explorer
on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "examples/demo/**"
      - "tools/demobuild/**"
      - "tools/devbuild/**"
      - "src/**"
      - "tools/Sync-PROBDIST-VBA.ps1"
      - "ci/Test-SyncWorkbook.ps1"
      - "ci/Test-Explorer.ps1"
      - "ci/Test-Probabilities.ps1"
      - "ci/Test-ParameterEffects.ps1"
      - "ci/Test-Comparison.ps1"
      - "ci/Test-Tails.ps1"
      - "ci/Test-Discrete.ps1"
      - "ci/Test-Risk.ps1"
      - "ci/Test-Diagnostics.ps1"
      - "ci/Show-ExcelCrash.ps1"
      - "ci/Test-UdfRegistration.ps1"
      - "ci/Test-ExplorerUI.ps1"
      - "ci/Test-ExplorerStates.ps1"
      - "ci/Test-DemoPackage.ps1"
      - "tests/test_demo_explorer.py"
      - ".github/workflows/demo-explorer.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.12.16"
concurrency:
  group: demo-explorer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m unittest discover -s tests -p 'test_demo_*.py' -v
      - run: python tools/demobuild/explorer_build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: explorer-source-package
          path: test-results/demo/
  excel:
    needs: package
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: [self-hosted, Windows, X64, excel]
    # The job builds the workbook and runs the Excel checks of ten sheets, the Tails sheet included: about 20
    # minutes. 15 was the limit once, and a slower runner cancelled the job in the last UI step.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: explorer-source-package
          path: test-results/demo
      - name: Apply the Explorer plan with native Excel objects
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\demobuild\Evolve-Explorer.ps1 -PackageDirectory test-results\demo
      - name: Apply the Probabilities plan with native Excel objects
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\demobuild\Evolve-Probabilities.ps1 -PackageDirectory test-results\demo
      - name: Apply the Parameter Effects plan with native Excel objects
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\demobuild\Evolve-ParameterEffects.ps1 -PackageDirectory test-results\demo
      - name: Apply the Comparison plan with native Excel objects
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\demobuild\Evolve-Comparison.ps1 -PackageDirectory test-results\demo
      - name: Apply the Tails plan with native Excel objects
        # Every run builds the Tails sheet, a change to the release branch too, so that the workbook under
        # test is the one that ships. A workbook with the Diagnostics sheet and the Tails sheet left unbuilt
        # made Excel stop with an access violation in another sheet's macro in 6 runs out of 7 (#261); with
        # the Tails sheet built, none did.
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\demobuild\Evolve-Tails.ps1 -PackageDirectory test-results\demo
      - name: Apply the Discrete plan with native Excel objects
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\demobuild\Evolve-Discrete.ps1 -PackageDirectory test-results\demo
      - name: Apply the Risk plan with native Excel objects
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\demobuild\Evolve-Risk.ps1 -PackageDirectory test-results\demo
      - name: Apply the Diagnostics plan with native Excel objects
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\demobuild\Evolve-Diagnostics.ps1 -PackageDirectory test-results\demo
      - name: Verify Function Wizard registration lifecycle
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-UdfRegistration.ps1 -PackageDirectory test-results\demo
      - name: Verify every family through single edits, macros off, and a stale file
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-ExplorerStates.ps1 -PackageDirectory test-results\demo
      - name: Verify references, edited inputs, charts and reset
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-Explorer.ps1 -PackageDirectory test-results\demo
      - name: Verify the Probabilities sheet against the mpmath references
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-Probabilities.ps1 -PackageDirectory test-results\demo
      - name: Verify the Parameter Effects sheet against the mpmath references
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-ParameterEffects.ps1 -PackageDirectory test-results\demo
      - name: Verify the Comparison sheet against the study's references
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-Comparison.ps1 -PackageDirectory test-results\demo
      - name: Verify the Tails sheet against the mpmath references
        # Every run checks the Tails sheet: see its build step above.
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-Tails.ps1 -PackageDirectory test-results\demo
      - name: Verify the Discrete sheet against the mpmath references
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-Discrete.ps1 -PackageDirectory test-results\demo
      - name: Verify the Risk sheet against the mpmath references
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-Risk.ps1 -PackageDirectory test-results\demo
      - name: Verify the Diagnostics sheet against its documented outcomes
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-Diagnostics.ps1 -PackageDirectory test-results\demo
      - name: Exercise the native Ribbon and reset confirmation dialog
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-ExplorerUI.ps1 -PackageDirectory test-results\demo
      - name: Verify the completed workbook save and navigation contract
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-DemoPackage.ps1 -PackageDirectory test-results\demo
      - name: Build a workbook from the template with the sync script and synchronize it again
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Test-SyncWorkbook.ps1 -OutputDirectory test-results\demo\sync
      - name: Show what Windows recorded about an Excel crash
        if: failure()
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\Show-ExcelCrash.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: explorer-workbook-and-evidence
          path: test-results/demo/
          retention-days: 14
