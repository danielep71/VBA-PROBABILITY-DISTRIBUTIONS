name: Static checks
run-name: Static checks — ${{ github.ref_name }} @ ${{ github.sha }}

# Excel-free integrity checks of the repository itself: committed whitespace,
# procedure-scoped VBA jumps, release semantics and workflow validity. They
# complement, but never replace, the Excel/VBA regression, the numerical
# Accuracy Gate or release certification. The checkers live in tools/ and are
# imported from the portfolio template; see tools/README.md.
#
# Every check runs even when an earlier one fails, so one run reports every
# problem; the final step turns any failed check into a failed job.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Unfiltered, like the other required checks, so every pull request reports.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static-checks:
    name: Repository integrity (static, no Excel)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_VERSION: "3.12"
      # Pinned by version and content hash; bump both together.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the whitespace check inspects the candidate range.
          fetch-depth: 0

      - name: Confirm the checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Prepare the results directory
        run: mkdir -p test-results

      - name: Exercise committed-whitespace fixtures
        id: whitespace-self-test
        continue-on-error: true
        run: python3 tools/check_committed_whitespace.py --root . --self-test

      - name: Validate committed candidate whitespace
        id: whitespace
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          args=(
            --root .
            --mode committed
            --head "$CANDIDATE_SHA"
            --output test-results/committed-whitespace.json
            --summary test-results/committed-whitespace.md
          )
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 tools/check_committed_whitespace.py "${args[@]}"

      - name: Exercise procedure-scoped VBA jump fixtures
        id: vba-jumps-self-test
        continue-on-error: true
        run: python3 tools/check_vba_jumps.py --root . --self-test

      - name: Validate procedure-scoped VBA jumps
        id: vba-jumps
        continue-on-error: true
        run: >-
          python3 tools/check_vba_jumps.py
          --root .
          --output test-results/vba-jumps.json
          --summary test-results/vba-jumps.md

      - name: Exercise release-semantics fixtures
        id: release-semantics-self-test
        continue-on-error: true
        run: python3 tools/check_release_semantics.py --root . --self-test

      - name: Validate release semantics
        id: release-semantics
        continue-on-error: true
        run: >-
          python3 tools/check_release_semantics.py
          --root .
          --output test-results/release-semantics.json
          --summary test-results/release-semantics.md

      - name: Install the pinned workflow validator
        id: actionlint-install
        continue-on-error: true
        run: |
          dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          archive="${dir}/actionlint.tar.gz"
          mkdir -p "$dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --retry-all-errors --silent --show-error --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" \
            | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$dir" actionlint
          "$dir/actionlint" -version | tee test-results/actionlint-version.txt
          printf 'path=%s\n' "$dir/actionlint" >> "$GITHUB_OUTPUT"

      - name: Validate workflows
        id: actionlint
        continue-on-error: true
        env:
          ACTIONLINT: ${{ steps.actionlint-install.outputs.path }}
        run: |
          test -n "$ACTIONLINT"
          # -config-file makes the self-hosted runner label declaration explicit.
          "$ACTIONLINT" -no-color -config-file .github/actionlint.yaml \
            | tee test-results/actionlint.txt
          exit "${PIPESTATUS[0]}"

      - name: Publish summary
        if: always()
        run: |
          for f in committed-whitespace vba-jumps release-semantics; do
            if [[ -f "test-results/$f.md" ]]; then
              cat "test-results/$f.md" >> "$GITHUB_STEP_SUMMARY"
              printf '\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload static-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce every check
        if: always()
        env:
          WHITESPACE_SELF_TEST: ${{ steps.whitespace-self-test.outcome }}
          WHITESPACE: ${{ steps.whitespace.outcome }}
          VBA_JUMPS_SELF_TEST: ${{ steps.vba-jumps-self-test.outcome }}
          VBA_JUMPS: ${{ steps.vba-jumps.outcome }}
          RELEASE_SEMANTICS_SELF_TEST: ${{ steps.release-semantics-self-test.outcome }}
          RELEASE_SEMANTICS: ${{ steps.release-semantics.outcome }}
          ACTIONLINT_INSTALL: ${{ steps.actionlint-install.outcome }}
          ACTIONLINT: ${{ steps.actionlint.outcome }}
        run: |
          failed=0
          for item in \
            "Committed-whitespace fixtures:$WHITESPACE_SELF_TEST" \
            "Committed whitespace:$WHITESPACE" \
            "VBA jump fixtures:$VBA_JUMPS_SELF_TEST" \
            "VBA jumps:$VBA_JUMPS" \
            "Release-semantics fixtures:$RELEASE_SEMANTICS_SELF_TEST" \
            "Release semantics:$RELEASE_SEMANTICS" \
            "Workflow validator install:$ACTIONLINT_INSTALL" \
            "Workflow validation:$ACTIONLINT"; do
            label="${item%%:*}"
            outcome="${item##*:}"
            printf '%-32s %s\n' "$label" "$outcome"
            # Anything but success fails, including a step that never ran.
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"
