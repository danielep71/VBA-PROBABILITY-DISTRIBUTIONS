name: Static checks
run-name: Static checks — ${{ github.ref_name }} @ ${{ github.sha }}

# Excel-free integrity checks of the repository itself: committed whitespace,
# procedure-scoped VBA jumps, release semantics, release-bundle builder
# fixtures, the Python unit tests under tests/, Python correctness lint (Ruff),
# strict type checking (mypy) and workflow validity (actionlint, with a probe
# that proves it rejects an invalid workflow). They complement, but never
# replace, the Excel/VBA regression, the numerical Accuracy Gate or release
# certification.
#
# One command, tools/run_static_checks.py, runs every check, here and locally;
# see tools/README.md. Every check runs even when an earlier one fails, so one
# run reports every problem. With --strict, a check whose tool failed to
# install fails instead of being skipped, and any failed check fails the job.
#
# The minimum-python job runs the same command on the documented minimum
# Python. It is not a required check.

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  # Unfiltered, like the other required checks, so every pull request reports.
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The CI interpreter, an exact patch release, used by every workflow that
  # sets up Python; tools/README.md ("Python versions") lists where it is set.
  PYTHON_VERSION: "3.12.16"
  # The documented minimum Python, checked by the minimum-python job.
  MINIMUM_PYTHON_VERSION: "3.11.18"

jobs:
  static-checks:
    name: Repository integrity (static, no Excel)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # Pinned by version and content hash; bump both together.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the whitespace check inspects the candidate range.
          fetch-depth: 0

      - name: Confirm the checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the hash-locked Python linter and type checker
        continue-on-error: true
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r tools/requirements-lint-ci.txt
          mkdir -p test-results
          python -m ruff --version | tee test-results/ruff-version.txt
          python -m mypy --version | tee test-results/mypy-version.txt

      - name: Install the pinned workflow validator
        continue-on-error: true
        run: |
          dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          archive="${dir}/actionlint.tar.gz"
          mkdir -p "$dir" test-results
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --retry-all-errors --silent --show-error --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" \
            | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$dir" actionlint
          "$dir/actionlint" -version | tee test-results/actionlint-version.txt

      - name: Run every static check
        # The installs above continue on error so that this one command still
        # runs and reports every check; --strict fails a check whose tool is
        # missing. Per-check logs, report.json (commit, dirty state, pull
        # request head, SHA-256 of every tracked file) and the job summary go
        # to test-results/static-checks/.
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        # The pinned actionlint path, never one found on PATH.
        run: >-
          python tools/run_static_checks.py --strict
          --actionlint "${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}/actionlint"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload static-check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  minimum-python:
    # Not a required check: it confirms that the repository's Python tooling
    # still runs on the documented minimum Python (tools/README.md). It installs
    # no tool, so Ruff, mypy and actionlint are reported as skipped; every other
    # check, the unit tests under tests/ included, runs and must pass.
    name: Minimum Python (3.11, not required)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the whitespace check inspects the candidate range.
          fetch-depth: 0

      - name: Set up the minimum Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.MINIMUM_PYTHON_VERSION }}

      - name: Run every check that needs no installed tool
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: python tools/run_static_checks.py --summary "$GITHUB_STEP_SUMMARY"
